version: "2"

linters:
  default: all
  disable:
    - depguard
    # Deprecated linters replaced by newer versions.
    - wsl
    - gomodguard
    # We may enable this in the future.
    - exhaustruct
    # Acting up with replace directives in go.mod
    - gomoddirectives
    # Kubernetes objects are all interface based
    - ireturn
