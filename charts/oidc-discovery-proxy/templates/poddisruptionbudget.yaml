{{- $autoscaling := .Values.autoscaling.enabled -}}
{{- $multipleReplicas := gt (int .Values.replicas) 1 -}}
{{- $multipleMinReplicas := gt (int .Values.autoscaling.minReplicas) 1 -}}
{{- $pdbNeeded := or (and (not $autoscaling) $multipleReplicas) (and $autoscaling $multipleMinReplicas) -}}
{{- if $pdbNeeded }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ include "oidc-discovery-proxy.version" . }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  maxUnavailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
{{- end }}
