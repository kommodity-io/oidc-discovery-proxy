gateway:
  # Set enabled to false to use Ingress instead of Gateway API
  enabled: true
  name: envoy-gateway
  namespace: default

ingress:
  className: ""
  annotations: {}
  tls:
    enabled: false
    # Override auto-generated secret name ({release}-{host}-tls; host is lowercased and '.' -> '-').
    # If set, all hosts share this secret.
    secretName: ""

# If host is not set, it will default to ClusterIP and won't be accessible externally
host:
  domain: REPLACE_ME.com
  prefixes: []
  exact: []

image:
  repository: ghcr.io/kommodity-io/oidc-discovery-proxy
  # Image tag. Defaults to the chart's appVersion if omitted.
  tag: ~
  pullPolicy: IfNotPresent

imagePullSecrets: []

replicas: 2

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 100
  targetMemoryUtilizationPercentage: 90

resources:
  requests:
    cpu: 50m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 64Mi

podLabels: {}

podAnnotations: {}

nodeSelector: {}

tolerations: []
